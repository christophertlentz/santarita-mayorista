@if (auth.usuario(); as usuario) {
  <h1 class="h3">Panel interno</h1>
  <p class="lead mb-1">Hola, {{ usuario.nombreContacto }}.</p>
  <p>
    Rol: <span class="badge bg-success text-capitalize">{{ usuario.rol }}</span>
  </p>

  @if (usuario.rol === 'administrador') {
    <a routerLink="/panel/productos" class="btn btn-success mb-3">
      <i class="bi bi-box-seam"></i> Mantenimiento de productos
    </a>
  }

  <div class="alert alert-info" role="status">
    La gestión de stock y pedidos estará disponible próximamente.
  </div>
}
