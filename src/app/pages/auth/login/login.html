<div class="row justify-content-center">
  <div class="col-sm-10 col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">Iniciar sesión</h1>

        @if (registroExitoso) {
          <div class="alert alert-success" role="alert">
            Tu cuenta fue creada. Ingresa con tu correo y contraseña.
          </div>
        }

        @if (errorLogin()) {
          <div class="alert alert-danger" role="alert">{{ errorLogin() }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo</label>
            <input
              id="correo"
              type="email"
              class="form-control"
              formControlName="correo"
              autocomplete="email"
              [class.is-invalid]="mostrarError('correo')"
            />
            @if (mostrarError('correo')) {
              <div class="invalid-feedback">Ingresa un correo válido</div>
            }
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input
              id="password"
              type="password"
              class="form-control"
              formControlName="password"
              autocomplete="current-password"
              [class.is-invalid]="mostrarError('password')"
            />
            @if (mostrarError('password')) {
              <div class="invalid-feedback">Ingresa tu contraseña</div>
            }
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-success" [disabled]="enviando()">
              @if (enviando()) {
                <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                Ingresando...
              } @else {
                Ingresar
              }
            </button>
          </div>
        </form>

        <p class="mt-3 mb-0 small">
          ¿Aún no tienes cuenta? <a routerLink="/registro">Regístrate</a>
        </p>
      </div>
    </div>
  </div>
</div>
